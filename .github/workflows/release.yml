name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cmt-ipas
            asset_name: cmt-ipas-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cmt-ipas.exe
            asset_name: cmt-ipas-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Assets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cp -r web dist/
          cp -r config dist/
          rm -f dist/config/rumqttd.toml dist/web/mqtt-doc.html
          tar -czf ${{ matrix.asset_name }} -C dist .

      - name: Package Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.artifact_name }} -Destination dist\
          Copy-Item -Recurse web -Destination dist\
          Copy-Item -Recurse config -Destination dist\
          if (Test-Path "assets") { Copy-Item -Recurse assets -Destination dist\ }
          Remove-Item dist\config\rumqttd.toml -Force
          Remove-Item dist\web\mqtt-doc.html -Force
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
